name: Proving Ground Contract

on:
  pull_request:
    paths:
      - "contracts/proving-ground/**"
      - ".github/workflows/proving-ground-contract.yml"
  push:
    branches: [main]
    paths:
      - "contracts/proving-ground/**"
      - ".github/workflows/proving-ground-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Validate schema and fixtures
        run: >
          uv run --no-project --python 3.12
          --with "jsonschema==4.26.0"
          python contracts/proving-ground/validate_contract.py
