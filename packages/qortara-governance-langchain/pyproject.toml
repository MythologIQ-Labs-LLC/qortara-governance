[project]
name = "qortara-governance-langchain"
version = "0.2.1"
description = "Qortara Governance — LangChain/LangGraph dispatch-path enforcement SDK. Bypass-resistant BaseTool/ToolNode interception routed into Microsoft AGT's in-process policy engine; optional remote sidecar + hosted Azure decision service."
authors = [{ name = "MythologIQ Labs", email = "team@mythologiq.studio" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["langchain", "governance", "policy", "trust", "agents", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langchain-core>=0.3",
    "httpx>=0.28",
    "opentelemetry-api>=1.30",
    "qortara-protocol==0.1.2",
    # Qortara's in-process AGT adapter imports PolicyEngine from the core
    # distribution. Test the current consolidated AGT core directly; the former
    # 4.x protocols/integrations pins are not imported by Qortara source.
    "agent-governance-toolkit-core==5.0.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0", "mypy>=1.17", "ruff==0.16.4"]

[project.urls]
Homepage = "https://qortara.com/governance"
Repository = "https://github.com/MythologIQ-Labs-LLC/qortara-governance"
Issues = "https://github.com/MythologIQ-Labs-LLC/qortara-governance/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qortara_governance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

# Preserve the repository's established lint contract explicitly. A prior
# workspace-wide B/UP/SIM expansion was reverted because it changed the gate
# beneath already-reviewed code. Rule-set expansion belongs in a dedicated,
# audited migration rather than arriving through tool-version drift.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]

# qortara-protocol 0.1.0 ships without a py.typed marker; allow the missing
# stubs until 0.1.1+ adds the marker. Retained at 0.1.2 pending operator
# confirmation that the PyPI-published protocol wheel ships py.typed.
[[tool.mypy.overrides]]
module = "qortara_protocol.*"
ignore_missing_imports = true

# Keep the existing import tolerance during the first AGT 5 compatibility
# probe; removing it is a separate typing-hardening decision after runtime
# and conformance behavior is proven on the published wheel.
[[tool.mypy.overrides]]
module = "agent_control_plane.*"
ignore_missing_imports = true
